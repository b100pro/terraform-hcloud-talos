name: Developer Experience
on:
  workflow_dispatch:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main

permissions: read-all

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  opentofu-check:
    name: OpenTofu Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      issues: write # for create or update comment
      pull-requests: write # for create or update comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: ~1.8.0
          - version: ~1.9.0
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Configure OpenTofu plugin cache
        run: |
          mkdir -p ~/.opentofu.d/plugin-cache
          cat > ~/.tofurc <<EOF
          plugin_cache_dir = "$HOME/.opentofu.d/plugin-cache"
          EOF
      - name: Cache OpenTofu
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.opentofu.d/plugin-cache
          key: "${{ runner.os }}-opentofu-${{ hashFiles('.terraform.lock.hcl') }}"
          restore-keys: "${{ runner.os }}-opentofu-"
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: ${{ matrix.version }}
      - name: Save OpenTofu version to output
        id: tofu-version
        run: |
          tofu version
          echo "TOFU_VERSION=$(tofu version -json | jq -r '.opentofu_version')" >> $GITHUB_OUTPUT
      - name: OpenTofu Format
        id: fmt
        run: tofu fmt -recursive -check -diff
        continue-on-error: true
      - name: OpenTofu Init
        id: init
        run: tofu init -no-color
        continue-on-error: true
      - name: OpenTofu Validate
        id: validate
        run: tofu validate -no-color
        continue-on-error: true
      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: |
            OpenTofu-Check (version: ${{ steps.tofu-version.outputs.TOFU_VERSION }})
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ### OpenTofu-Check (version: ${{ steps.tofu-version.outputs.TOFU_VERSION }}): ${{ steps.fmt.outcome == 'success' && steps.init.outcome == 'success' && steps.validate.outcome == 'success' && '✅' || '❌' }}

            <details><summary>🖌 OpenTofu Format: ${{ steps.fmt.outcome == 'success' && '✅' || '❌' }}</summary>

            ```
            # Outputs:
            ${{ steps.fmt.outputs.stdout }}

            # Errors:
            ${{ steps.fmt.outputs.stderr }}
            ```

            </details>

            <details><summary>⚙️ OpenTofu Init: ${{ steps.init.outcome == 'success' && '✅' || '❌' }}</summary>

            ```
            # Outputs:
            ${{ steps.init.outputs.stdout }}

            # Errors:
            ${{ steps.init.outputs.stderr }}
            ```
            </details>

            <details><summary>🤖 OpenTofu Validate: ${{ steps.validate.outcome == 'success' && '✅' || '❌' }}</summary>

            ```
            # Outputs:
            ${{ steps.validate.outputs.stdout }}

            # Errors:
            ${{ steps.validate.outputs.stderr }}
            ```

            </details>
      - name: Fail on error
        if: ${{
          steps.fmt.outcome != 'success'
          || steps.init.outcome != 'success'
          || steps.validate.outcome != 'success'
          }}
        run: |
          exit 1

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      issues: write # for create or update comment
      pull-requests: write # for create or update comment
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Setup Node and Yarn Cache
        uses: ./.github/actions/setup-node-and-yarn-cache
        with:
          cache-dependency-path: .github/commitlint/yarn.lock
      - name: Yarn install
        run: yarn install --immutable --immutable-cache
        working-directory: ./.github/commitlint
      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: yarn commitlint --last --verbose
        working-directory: ./.github/commitlint
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request_target'
        id: validate
        run: |
          yarn commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose > commitlint_output.txt
        working-directory: ./.github/commitlint
      - name: Print commitlint output
        if: ${{ always() }}
        run: |
          echo $(cat ./.github/commitlint/commitlint_output.txt)
      - name: Set commitlint output to env
        if: ${{ always() }}
        run: |
          {
            echo 'commitlint_output<<EOF'
            cat ./.github/commitlint/commitlint_output.txt
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Find Comment
        if: ${{ always() }}
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: |
            Commitlint-Check
      - name: Create or update commitlint comment on failure
        if: ${{ failure() }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ### Commitlint-Check
            Thanks for your contribution :heart:

            Unfortunately, [commitlint](https://commitlint.js.org) has detected that this PR has one ore more commit messages that do not follow the [conventional commit format](https://www.conventionalcommits.org/en/v1.0.0/) :scream_cat:

            ```
            ${{ env.commitlint_output }}
            ```

            Please update the commit messages accordingly.
          reactions: eyes
      - name: Create or update commitlint comment on success
        if: ${{ success() }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ### Commitlint-Check
            Thanks for your contribution :heart:

            [commitlint](https://commitlint.js.org) has detected that all commit messages in this PR follow the [conventional commit format](https://www.conventionalcommits.org/en/v1.0.0/) :tada:
          reactions: hooray

  dev_xperience_status_check:
    name: DevXperience status check
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - opentofu-check
      - commitlint
    steps:
      - name: Fail on error
        # see https://stackoverflow.com/a/67532120/4907315 and https://github.com/orgs/community/discussions/26822#discussioncomment-3305794
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
        run: |
          echo There are failing or cancelled jobs
          exit 1
